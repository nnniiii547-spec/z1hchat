<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z1HCHAT - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <a href="index.html" class="back-link">&larr; Back</a>
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 100 100" width="60" height="60">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#667eea"/>
              <stop offset="100%" style="stop-color:#764ba2"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="48" fill="url(#logoGrad)"/>
          <path d="M25 35 L50 20 L75 35 L75 55 C75 70 50 85 50 85 C50 85 25 70 25 55 Z" fill="white" opacity="0.95"/>
          <circle cx="38" cy="48" r="5" fill="#667eea"/>
          <circle cx="50" cy="48" r="5" fill="#764ba2"/>
          <circle cx="62" cy="48" r="5" fill="#667eea"/>
          <path d="M35 60 Q50 72 65 60" fill="none" stroke="#667eea" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in with email or username</p>
    </div>

    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label for="login">Email or Username</label>
        <input type="text" id="login" placeholder="Email or username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <div class="error-message" id="errorMsg"></div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create one</a>
    </div>
    <div style="text-align:center;margin-top:12px;"><a href="admin.html" style="font-size:12px;color:#6868a0;">Admin Panel</a></div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      const login = document.getElementById('login').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password })
        });
        const data = await res.json();
        if (!res.ok) { errorMsg.textContent = data.error; return; }
        localStorage.setItem('user', JSON.stringify({ id: data.userId, username: data.username, avatar: data.avatar }));
        window.location.href = 'chat.html';
      } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
      }
    });
  </script>
</body>
</html>
